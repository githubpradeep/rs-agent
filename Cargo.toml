[package]
name = "rs-agent"
version = "0.1.0"
edition = "2021"
description = "Lean terminal coding agent with Deep Context: a persistent REPL keeps huge files out of the window"
license = "MIT"
repository = "https://github.com/githubpradeep/rs-agent"
homepage = "https://github.com/githubpradeep/rs-agent"
readme = "README.md"
keywords = ["agent", "rlm", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["rs-agent contributors"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Markdown rendering
pulldown-cmark = "0.10"

# Utilities
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
crossbeam-channel = "0.5"
regex = "1"
tempfile = "3"
globset = "0.4"
walkdir = "2"

# Web tools
scraper = "0.20"

# Turn snapshot content hashing
sha2 = "0.10"
hex = "0.4"
toml = "1.1.3"
serde_yaml = "0.9.34"
similar = "2"
base64 = "0.22"

